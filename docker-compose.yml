services:
  app:
    build: .
    image: bgzf-audit:latest
    environment:
      PORT: 8080
    ports:
      # Host-side published port is configurable via APP_PORT.
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; p=os.environ.get('PORT','8080'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  verify:
    image: bgzf-audit:latest
    build: .
    command: ["sh", "scripts/verify.sh"]
    environment:
      BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
